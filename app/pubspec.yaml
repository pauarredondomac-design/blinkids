name: blinkids
description: Blinkids — Videojuego educativo de finanzas personales para niños
publish_to: none
version: 1.0.0+11

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Motor de juego 2D
  flame: ^1.18.0

  # Estado global
  flutter_riverpod: ^2.5.1

  # Navegación
  go_router: ^14.2.0

  # Backend
  supabase_flutter: ^2.9.0
  http: ^1.6.0

  # Autenticación social
  google_sign_in: ^6.2.1

  # Animaciones Flutter
  flutter_animate: ^4.5.0

  # Almacenamiento local
  shared_preferences: ^2.3.2

  # URL launcher para OAuth en web
  url_launcher: ^6.3.0

  # Push notifications
  onesignal_flutter: ^5.2.5

  # Hash del PIN (SHA-256)
  crypto: ^3.0.3

  # Audio / música de fondo
  just_audio: ^0.9.39

  # Video (animación de despegue del cohete)
  video_player: ^2.9.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icono.png"
  min_sdk_android: 21
  remove_alpha_ios: true
  background_color_ios: "#09001E"
  adaptive_icon_background: "#3A1A78"
  adaptive_icon_foreground: "assets/icon/app_icono.png"

flutter:
  uses-material-design: true
  assets:
    - assets/blink/
    - assets/blink/layers/
    - assets/blink/poses/
    - assets/cosmetics/shop/
    - assets/cosmetics/equipped/
    - assets/worlds/space/
    - assets/worlds/forest/
    - assets/worlds/sea/
    - assets/ui/coin/
    - assets/ui/
    - assets/ui/modal/
    - assets/ui/modal/buttons/
    - assets/ui/modal/categories/
    - assets/ui/modal/actions/
    - assets/sounds/
    - assets/items/
    - assets/badges/
    - assets/animations/
    - assets/fonts/
    - assets/icons/

  fonts:
    - family: Baloo2
      fonts:
        - asset: assets/fonts/Baloo2-Variable.ttf
          weight: 400
        - asset: assets/fonts/Baloo2-Variable.ttf
          weight: 500
        - asset: assets/fonts/Baloo2-Variable.ttf
          weight: 600
        - asset: assets/fonts/Baloo2-Variable.ttf
          weight: 700
        - asset: assets/fonts/Baloo2-Variable.ttf
          weight: 800
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Variable.ttf
          weight: 400
        - asset: assets/fonts/Nunito-Variable.ttf
          weight: 500
        - asset: assets/fonts/Nunito-Variable.ttf
          weight: 600
        - asset: assets/fonts/Nunito-Variable.ttf
          weight: 700
        - asset: assets/fonts/Nunito-Variable.ttf
          weight: 800
